<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.svg" type="image/svg+xml"><title>完整原講義逐頁閱讀｜Studyhighschool</title>
<style>
:root{--bg:#f5f3ec;--paper:#fffdf8;--ink:#23322f;--muted:#687771;--line:#dcded4;--accent:#177766;--soft:#e5f0e8}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 "Microsoft JhengHei",system-ui,sans-serif}a{color:var(--accent)}button,select,input{font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 12px;max-width:100%}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}header{max-width:1400px;margin:auto;padding:24px 28px 10px}h1{margin:8px 0;font-size:30px}header p{color:var(--muted);margin:5px 0}
.controls{position:sticky;top:0;z-index:4;background:var(--paper);border-block:1px solid var(--line);padding:12px 28px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}label{display:flex;gap:6px;align-items:center}.controls input[type=number]{width:90px}
.layout{max-width:1440px;margin:auto;display:grid;grid-template-columns:275px minmax(0,1fr);gap:24px;padding:24px 28px}.side-panel{min-width:0}.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}.panel h2{font-size:18px;margin:0 0 12px}.chapters{display:grid;gap:8px}.chapters button{text-align:left;border-left:3px solid var(--accent);line-height:1.5}.chapters button small{display:block;color:var(--muted)}.search-results{max-height:440px;overflow:auto;display:grid;gap:8px}.search-results button{text-align:left;font-size:14px}.search-results p{font-size:13px;color:var(--muted)}.page-view{min-width:0}.page-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:12px}.page-head h2{font-size:20px;margin:0;margin-right:auto}.image-wrap{overflow:auto;background:#e0e1da;border:1px solid var(--line);border-radius:10px;padding:10px}.image-wrap img{display:block;width:100%;height:auto;margin:auto;cursor:zoom-in}.image-wrap.zoom img{width:1600px;max-width:none;cursor:zoom-out}.source-text{white-space:pre-wrap;word-break:break-word;font-size:14px;max-height:500px;overflow:auto;padding:15px;background:var(--paper)}.fine{font-size:13px;color:var(--muted)}.status{min-height:1.7em;color:var(--accent)}.footer-nav{display:flex;justify-content:space-between;gap:15px;margin:15px 0}.current{background:var(--soft)}:focus-visible{outline:3px solid #c39427;outline-offset:3px}
@media(max-width:800px){header{padding:20px 16px 8px}h1{font-size:25px}.controls{padding:10px 16px;position:static}.layout{display:flex;flex-direction:column;padding:16px;gap:0}.side-panel{order:2}.page-view{order:1}.chapters{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.image-wrap{padding:3px}.page-head h2{font-size:18px}}
@media print{header,.controls,.side-panel,.page-head a,.footer-nav,details,.fine{display:none}.layout{display:block;padding:0}.image-wrap{padding:0;border:0;overflow:visible}.image-wrap img,.image-wrap.zoom img{width:100%;max-width:100%}.page-head h2{font-size:14px}}
</style><script defer src="source-pages.js"></script><script defer src="sources.js"></script></head>
<body><header><a href="index.html">← 回四科講義首頁</a><h1>把完整講義放在手邊</h1><p>四份參考講義，共366頁。圖表、完整題幹、選項、附答與手寫註記依原頁保留。</p><p class="fine">本頁頁碼一律指PDF順序，可能與頁角印刷頁碼不同。先讀電子概念講義，再回原頁練習。</p></header>
<div class="controls" aria-label="原講義閱讀控制"><label>冊別<select id="book" aria-label="冊別"></select></label><label>PDF頁碼<input type="number" id="page" min="1" value="1" aria-label="PDF頁碼"></label><button id="go">跳頁</button><button id="prev">← 上一頁</button><button id="next">下一頁 →</button><button id="zoom" aria-pressed="false">放大原頁</button><button id="print">列印此頁</button><span id="count" aria-live="polite"></span></div>
<main class="layout"><aside class="side-panel"><section class="panel"><h2>依單元閱讀</h2><div id="chapters" class="chapters"></div></section><section class="panel"><h2>搜尋四份原講義</h2><label><input type="search" id="search" placeholder="例如：潮汐、染色體" aria-label="搜尋四份原講義"></label><button id="find">搜尋</button><p class="fine">搜尋使用原講義的文字辨識資料，特殊符號與辨識錯字仍可能影響結果。</p><div id="results" class="search-results" aria-live="polite"></div></section></aside>
<section class="page-view"><div class="page-head"><h2 id="title"></h2><a id="lesson">回概念講解 →</a></div><div id="status" class="status" role="status"></div><div class="image-wrap" id="imageWrap"><img id="original" alt="" width="1600" decoding="async"></div><div class="footer-nav"><button id="prevBottom">← 上一頁</button><button id="nextBottom">下一頁 →</button></div><details><summary>文字辨識輔助（請以原頁為準）</summary><p class="fine">這是原始辨識稿，未以不確定文字改寫原題；圖表、公式與正確題幹請看上方完整原頁。</p><div id="text" class="source-text"></div></details><p class="fine">鍵盤 ← → 可翻頁；輸入欄位編輯中不會觸發翻頁。按「放大原頁」或點原圖可看細節。</p></section></main></body></html>
