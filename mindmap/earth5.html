<script>
MindMap.render({t:"第5單元 海洋", href:"../earth/u5-考.html", n:"主線：海水本身的性質（溫度、鹽度、密度）→ 海水怎麼動：波浪（傳能量）、洋流（搬海水）、湧升流、聖嬰 → 潮汐（日月引潮力）。", c:[
 {t:"5-1 海水性質", href:"../earth/u5-1.html", c:[
  {t:"鹽度", n:"每公斤海水溶解物質的克數，平均約 <b>35‰</b>（千分之三十五，不是百分比）。"},
  {t:"鹽度看淡水收支", n:"<b>變鹹</b>：蒸發、結冰排鹽。<br><b>變淡</b>：降雨、河水注入、融冰。<br>副熱帶（蒸發 ＞ 降雨）表層最鹹；赤道雨多反而較淡；高緯融冰較淡。", c:[
   {t:"地中海題型", n:"地中海蒸發 ＞ 降雨 ⇒ 比大西洋鹹。<br>水量不變：流入 Q₁ ＞ 流出 Q₂（補蒸發）；鹽量不變：S₁ ＜ S₂。"},
   {t:"混合題型", n:"鹽量守恆：33x ＋ 1y ＝ 25(x＋y) ⇒ x：y ＝ 3：1。"}]},
  {t:"密度", n:"愈冷、愈鹹 ⇒ 密度愈大 ⇒ 下沉。<br>一個較冷、一個較鹹時，不能只憑單一因素判斷，要看數據。"},
  {t:"垂直分層", n:"<b>混合層</b>：表層被風浪攪拌，水溫均勻。<br><b>斜溫層</b>：溫度隨深度快速下降；低緯度最明顯。<br><b>深層</b>：低溫、變化小。"},
  {t:"穩定度", n:"上輕下重且密度差大 ⇒ 最穩定、最不易垂直對流。"}]},
 {t:"5-1 波浪", href:"../earth/u5-1.html", c:[
  {t:"風浪與湧浪", n:"風速愈大、吹愈久、風域愈長 ⇒ 波浪能量愈大。<br>離開風域繼續傳的叫<b>湧浪</b>（颱風未到，湧浪先到）。"},
  {t:"波傳能量，不搬海水", n:"深水中水粒子在原地作近圓形運動，影響隨深度減弱。<br>浮標上下起伏，不會每一波往岸邊移一個波長。"},
  {t:"靠岸變淺", n:"受海底影響：<b>波速變慢、波長變短（週期不變）、波高變大</b> → 碎波。<br>波前折射，逐漸與海岸線平行。"},
  {t:"海岬與海灣", n:"波能集中在<b>海岬</b> ⇒ 海岬侵蝕較強；海灣能量分散、較易堆積。"},
  {t:"波浪成因不只風", n:"海底地震也可造成波浪（海嘯）。"}]},
 {t:"5-2 洋流", href:"../earth/u5-2.html", c:[
  {t:"成因", n:"<b>風成流</b>：長期盛行風吹拂（表層主要）。<br><b>密度流</b>：溫鹽差造成（深層）。<br>地球自轉（科氏力）與海陸邊界改變流向，但不是生成原因。"},
  {t:"大洋環流", n:"中低緯度：北半球<b>順時針</b>、南半球<b>逆時針</b>。<br>暖流／寒流是和流經處同緯度海水比較。"},
  {t:"臺灣附近海流", n:"<b>黑潮</b>：終年沿臺灣東岸由南往北，高溫、高鹽的暖流。<br>冬季：中國沿岸流（冷）沿臺灣海峽南下（烏魚南下）。<br>夏季：臺灣海峽暖流往北。"},
  {t:"親潮與黑潮", n:"親潮由北南下，在日本東方遇黑潮後轉向<b>東</b>流入北太平洋。"}]},
 {t:"5-2 湧升流", href:"../earth/u5-2.html", c:[
  {t:"成因", n:"風把表層水吹離岸，深層水上升補充；或海流遇海底地形被迫上升（如臺灣東北外海）。"},
  {t:"特徵", n:"表層<b>水溫低</b>、密度較大、混合層變薄。<br>帶上<b>營養鹽</b>與 CO₂ ⇒ 浮游藻類繁盛 ⇒ 好漁場。<br>冷海面使暖溼空氣冷卻 ⇒ <b>易起霧</b>；白天海風較強。"},
  {t:"常見陷阱", n:"溶氧不一定較高；鹽度要看水源；營養鹽多 ⇒ 浮游生物多，水不一定較透明。"}]},
 {t:"5-2 聖嬰與反聖嬰", href:"../earth/u5-2.html", c:[
  {t:"正常年", n:"赤道東風（信風）把暖水推向<b>西太平洋</b>；東太平洋（南美西岸）冷水湧升。<br>西側暖溼多雨、東側乾冷。"},
  {t:"聖嬰", n:"東風<b>減弱</b> ⇒ 暖水東移 ⇒ 東太平洋海溫偏高、湧升<b>減弱</b>（漁獲減少）。<br>降雨區東移：東太平洋多雨、印尼澳洲偏乾（可能霾害）。<br>西太平洋海平面降低、溫暖混合層變薄。"},
  {t:"反聖嬰", n:"東風<b>增強</b> ⇒ 東太平洋更冷、湧升更強；西側更暖溼。"},
  {t:"讀距平圖", n:"正值 ＝ 比平均暖，負值 ＝ 比平均冷；距平不是實際溫度。<br>是海氣交互作用，重新分配熱量，並非全球同時變熱下雨。"}]},
 {t:"5-3 潮汐", href:"../earth/u5-3.html", c:[
  {t:"引潮力", n:"來自月球（及太陽）對地球近側與遠側的<b>引力差</b>。<br>太陽總引力大，但距離遠，引潮作用只有月球約一半。<br>實際潮汐還受海盆形狀、水深、海岸影響。"},
  {t:"大潮與小潮", n:"<b>大潮</b>：朔、望（日地月一直線）⇒ 潮差最大。<br><b>小潮</b>：上弦、下弦（日月方向垂直）⇒ 潮差最小。<br>小潮仍有滿潮與乾潮；大潮不是整天高水位。"},
  {t:"半日潮", n:"一個太陰日（約 24 時 50 分）兩次滿潮、兩次乾潮；相鄰滿潮約隔 12 時 25 分。<br>每天滿潮時間約延後 50 分鐘。"},
  {t:"讀潮位圖", n:"潮差 ＝ 滿潮位 − 相鄰乾潮位（不是相加）。<br>例：2.4 − 0.6 ＝ 1.8 m。<br>週期看相鄰同類極值的時間差。"},
  {t:"潮間帶", n:"潮差相同時，岸坡愈平緩，露出的潮間帶愈寬。"}]},
 {t:"重點對比", c:[
  {t:"傳能量 vs 搬海水", n:"波浪：傳能量，水粒子原地繞。<br>洋流：海水長距離實際移動。"},
  {t:"風成流 vs 密度流", n:"風成流：表層、盛行風驅動。<br>密度流：深層、溫鹽密度差驅動。"},
  {t:"聖嬰 vs 反聖嬰", n:"東風弱、東太平洋暖、湧升弱 ↔ 東風強、東太平洋冷、湧升強。"},
  {t:"大潮 vs 小潮", n:"朔望、一直線、潮差大 ↔ 上下弦、垂直、潮差小。"}]}
]});
</script>
