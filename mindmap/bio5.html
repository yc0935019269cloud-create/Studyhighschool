<script>
MindMap.render({t:"第5單元 演化", n:"主線：最早的生命從哪來 → 生物為何會變（演化機制）→ 憑什麼說有演化（證據與分類）→ 用數字看族群變化（哈溫）→ 實例：樺尺蛾、病毒、鐮形血球。", c:[
 {t:"5-1 生命的起源", href:"../biology/u5-1.html", c:[
  {t:"三種說法", n:"<b>自然發生說（無生源說）</b>：生物可由腐肉、爛泥產生（亞里斯多德、凡赫芒）。<br><b>生源說</b>：生物只來自原有生物（目前接受）。<br><b>新自然發生說＝化學演化</b>：最初的生命由無機物經長期化學作用形成；不代表現在還會自然發生。"},
  {t:"支持生源說的實驗", c:[
   {t:"雷迪：廣口瓶與肉", n:"敞開組有蛆、密封組沒有 ⇒ 蛆來自蒼蠅產卵。"},
   {t:"巴斯德：鵝頸瓶", n:"肉汁煮沸後 S 形瓶頸擋住微生物（空氣仍可進入）→ 不長微生物；折斷瓶頸 → 長出微生物。<br>⇒ 否定自然發生說。"}]},
  {t:"化學演化", c:[
   {t:"原始大氣", n:"N₂、NH₃、H₂、H₂S、CO、CO₂、CH₄、水蒸氣，<b>沒有 O₂</b>（還原性）。"},
   {t:"歐帕林（1924）", n:"無氧環境中，無機物經閃電、火山、紫外線等能量 → 簡單有機物 → 複雜有機物 → 生命。"},
   {t:"霍爾丹（1928）原生湯", n:"有機物在海洋累積，海洋像有機物熱湯，生命在其中形成。"},
   {t:"米勒與尤里（1953）", n:"CH₄、NH₃、H₂、H₂O 加熱並放電 → 一週後得 7 種胺基酸與有機酸。<br>證明：原始大氣氣體能形成有機物（不是證明生命能自然產生）。"},
   {t:"氣泡模型（1992）", n:"海底火山氣泡帶分子上升反應，在海面破裂後受輻射、閃電激發，再隨雨回海洋，反覆循環。"}]},
  {t:"原始細胞的雛形", n:"<b>微球</b>（福克斯 1960）：胺基酸加熱後入水，形成有雙層膜狀構造、能吸收物質、生長、分裂的小球。<br><b>脂質體</b>：脂質在水中自我組合成空心小球。"},
  {t:"RNA 世界", n:"闕克發現 RNA 有酵素功能（核酶）⇒ RNA 能攜帶訊息又能催化，可能是最早的生命分子；DNA 較晚出現。"},
  {t:"最早的生物", n:"原始細胞是<b>異營</b>；先有異營、後有自營（藍綠菌產氧）。<br>澳洲 35 億年前疊層石類似藍綠菌。"}]},
 {t:"5-2 演化觀念與機制", href:"../biology/u5-2.html", c:[
  {t:"拉馬克：用進廢退", n:"常用器官發達、不用退化，且<b>後天獲得性狀可遺傳</b>。<br>反證：魏斯曼剪老鼠尾巴 21 代，尾巴沒變短——體細胞的改變不影響生殖細胞 DNA。"},
  {t:"達爾文：天擇說（1859《物種起源》）", c:[
   {t:"啟發來源", n:"<b>萊爾</b>《地質學原理》：緩慢持續的力量造成巨變。<br><b>小獵犬號、加拉巴哥群島</b>：各島雀鳥喙形不同（適應輻射）。<br><b>馬爾薩斯人口論</b>：繁殖快於資源 ⇒ 生存競爭。<br><b>人擇</b>：育種證明變異可遺傳（野生芥菜 → 甘藍、花椰菜…）。"},
   {t:"天擇的邏輯", n:"個體有可遺傳變異 → 過度繁殖、資源有限 → 適者生存並留下較多後代 → 有利性狀逐代累積。"},
   {t:"觀點", n:"漸變（緩慢連續）；物種同源（共同祖先）。<br>限制：當時不知道變異從何而來。"}]},
  {t:"現代演化綜論", n:"以遺傳學（孟德爾、薩登、摩根）解釋變異來源。<br>新物種形成：遺傳變異 → 天擇 → 有利性狀累積 → <b>生殖隔離</b> → 新物種。"},
  {t:"間斷平衡（1972）", n:"艾爾德雷奇與古爾德：長期停滯，短期快速變化；解釋化石紀錄不連續。強調遺傳漂變。"},
  {t:"中性演化理論（木村資生 1968）", n:"多數分子層次突變是<b>中性</b>的，去留由<b>遺傳漂變</b>隨機決定。<br>沒有天擇也可能演化；不是推翻天擇，而是補充。<br>若突變率穩定，可用序列差異估計分歧時間（分子時鐘）。"},
  {t:"變異的來源", n:"<b>突變</b>：產生新等位基因，演化的原料。<br><b>有性生殖的基因重組</b>：最主要的變異來源（產生新組合）。<br>天擇<b>不創造</b>新性狀，只篩選既有的表現型。演化的單位是<b>族群</b>。"},
  {t:"天擇三型", n:"<b>穩定型</b>：中間型有利，兩端被淘汰（如嬰兒出生體重）。<br><b>定向型</b>：一端有利，平均值往一邊移（如樺尺蛾變深）。<br><b>分裂型</b>：兩端有利，中間淘汰，可能分成兩群。"},
  {t:"物種與種化", c:[
   {t:"生物種（梅爾 1942）", n:"自然狀況下能交配並產生<b>有生殖力</b>後代者為同種。<br>不適用：無性生殖、化石。形態種：依外形判斷。"},
   {t:"隔離", n:"<b>地理隔離</b>：山、海峽等阻隔；單有地理隔離不足以成新種。<br><b>生殖隔離</b>：判斷是否同種的依據，分合子前（時間、行為、構造…）與合子後（雜種不活、不孕，如騾）。"},
   {t:"異域種化", n:"先地理隔離再形成新種。例：大峽谷南北岸羚鼠、臺灣山椒魚。"},
   {t:"同域種化", n:"同一地區形成新種，可在一代內完成。例：植物<b>多倍體</b>（小麥、棉花、馬鈴薯）、維多利亞湖慈鯛。"}]}]},
 {t:"5-3 演化的證據與分類", href:"../biology/u5-3.html", c:[
  {t:"化石", n:"最直接的證據。水生生物遺骸較易被沉積物迅速掩埋 → 較易成化石。<br>依地質年代排列生物出現的先後。"},
  {t:"比較解剖學", c:[
   {t:"同源構造", n:"同一祖先、胚胎來源與基本構造相同，功能可不同 ⇒ <b>趨異演化</b>。<br>例：人手、馬前肢、鯨鰭、鳥翼、蝙蝠翼。"},
   {t:"同功構造", n:"不同祖先、功能相似 ⇒ <b>趨同演化</b>；不能當親緣依據。<br>例：鳥翼與昆蟲翅；聖誕紅紅色苞葉。"},
   {t:"痕跡構造", n:"退化無功能：人的闌尾、尾骨、智齒、動耳肌；鯨的退化骨盆；奇異鳥退化翼骨。<br>是突變經天擇的結果，<b>不是用進廢退</b>。"}]},
  {t:"胚胎學", n:"脊椎動物早期胚胎都有神經管、<b>咽囊</b>、脊索、尾 ⇒ 共同祖先。<br>咽囊：魚 → 鰓弧，人 → 耳咽管。<br>赫克爾重演說言過其實：不是依序經過魚期、兩生期。"},
  {t:"生物地理學", n:"加拉巴哥群島生物像南美、威德角群島像非洲（氣候相似）⇒ 由鄰近大陸遷入後演化。<br>海洋島嶼缺陸生哺乳類、兩生類。澳洲獨有單孔類、有袋類。"},
  {t:"生物化學", n:"DNA、蛋白質序列愈相似，親緣愈近。"},
  {t:"鳥類與恐龍", n:"始祖鳥：牙齒、翅端爪、長尾椎（爬蟲）＋ 羽毛（鳥）。近鳥龍：有羽毛的恐龍。<br>鳥類與恐龍最近，其次鱷魚；與哺乳類較遠。內溫是同功現象，不能當親緣依據。"},
  {t:"支序系統學與演化樹", n:"節點一分為二（姊妹群）。<b>共同衍徵</b>才是同一祖先的證據（祖徵不能）。<br>支條可繞節點旋轉，左右順序不代表演化先後。<br>現生物種演化時間相同，沒有誰「比較進化」。"},
  {t:"分類系統演變", n:"二界（林奈）→ 三界 → 五界（惠特克 1969）→ 六界 → <b>三域</b>（渥易斯 1990：真細菌、古細菌、真核）。<br>二域說：真核由古細菌內共生真細菌而來。"},
  {t:"生物多樣性與滅絕", n:"三層次：遺傳、物種、生態系多樣性。<br>過去 5 億年 5 次大滅絕（含恐龍）；恐龍滅絕後哺乳類填補生態地位。"}]},
 {t:"5-4 族群遺傳與哈溫定律", href:"../biology/u5-4.html", c:[
  {t:"基因池與等位基因頻率", n:"基因池：族群所有個體的等位基因總和。<br>例：AA 320、Aa 160、aa 20（共 500 人，1000 個等位基因）<br>A ＝ (640＋160)/1000 ＝ 0.8；a ＝ 0.2"},
  {t:"改變頻率的因素", c:[
   {t:"突變", n:"產生新等位基因。"},
   {t:"基因流動（遷移）", n:"個體遷入遷出改變基因池。"},
   {t:"遺傳漂變", n:"抽樣誤差造成的隨機改變；族群愈小影響愈大。<br><b>創始者效應</b>：少數個體建立新族群。<br><b>瓶頸效應</b>：災難後少數倖存。"},
   {t:"天擇", n:"不同基因型生殖成功率不同。"},
   {t:"非隨機交配", n:"改變基因型比例。"},
   {t:"基因重組不算", n:"只改變組合，<b>不改變等位基因頻率</b>。"}]},
  {t:"哈溫平衡（1908）", n:"p＋q ＝ 1；p²＋2pq＋q² ＝ 1<br>AA ＝ p²、Aa ＝ 2pq、aa ＝ q²", c:[
   {t:"成立條件", n:"族群極大（無漂變）、無突變、無遷移、隨機交配、無天擇（世代不重疊）。<br>條件都成立 ⇒ 頻率代代不變 ⇒ 不演化。"},
   {t:"解題起點：先找 q²", n:"隱性表現型一定是 aa ⇒ q² ＝ 隱性比例 ⇒ q ＝ √。<br>野花白花 4%：q ＝ 0.2、p ＝ 0.8 ⇒ AA 0.64、Aa 0.32。"},
   {t:"苯酮尿症", n:"每萬人 1 人：q ＝ 1/100 ⇒ 帶因者 2pq ≈ 2%。"},
   {t:"ABO 血型（三個等位基因）", n:"p＋q＋r ＝ 1。A 型 ＝ p²＋2pr、B 型 ＝ q²＋2qr、AB ＝ 2pq、O ＝ r²。"},
   {t:"性聯隱性（色盲）", n:"男性色盲比例 ＝ q（只有一條 X）；女性色盲 ＝ q²，女性帶因 ＝ 2pq。<br>男 8% 色盲 ⇒ 女 0.64%。"}]}]},
 {t:"5-5 樺尺蛾、病毒、鐮形血球", href:"../biology/u5-5.html", c:[
  {t:"樺尺蛾（工業黑化）", n:"英國工業化後樹幹被煤煙燻黑，深色蛾較不易被鳥吃 ⇒ 深色比例上升（1895 年達 98%）。<br>環境改變 → 天擇方向改變（定向天擇）；突變不是因為環境變黑才發生。"},
  {t:"病毒", c:[
   {t:"特性", n:"10–300 nm，需電子顯微鏡。<b>完全寄生</b>：無酵素系統、無代謝，只在活細胞內表現生命現象。<br>感染有<b>專一性</b>。"},
   {t:"構造", n:"蛋白質<b>殼體</b> ＋ 核酸（DNA <b>或</b> RNA，只有一種）。<br>部分有<b>套膜</b>（磷脂，來自宿主細胞膜或核膜），與專一性有關。"},
   {t:"生活史", n:"附著 → 穿透（噬菌體只注入核酸；動物病毒胞吞）→ 複製 → 組合 → 釋放。<br>釋放：多數使宿主解體；HIV、流感以<b>出芽</b>離開。"},
   {t:"傳播與演化", n:"不能主動傳播。病毒與宿主互為天擇壓力，持續共同演化。目前分類系統未納入病毒。"}]},
  {t:"鐮形血球貧血症", n:"S′S′：紅血球呈鐮刀形，嚴重貧血。<br>SS′（攜帶者）：通常不貧血，且<b>不易得瘧疾</b>。<br>⇒ 瘧疾流行區 S′ 頻率較高：基因有利或有害要看<b>環境</b>。", c:[
   {t:"例題：攜帶者 40%", n:"兩攜帶者結婚 0.4×0.4 ＝ 16%；子代 S′S′ ＝ 16% × 1/4 ＝ 4%。"},
   {t:"例題：正常雙親生出患者", n:"雙親都是 SS′。正常子女為 SS 的機率 ＝ 1/3（不是 1/4）。<br>正常父親有患病女兒 ⇒ 體染色體遺傳。"}]}]}
]});
</script>
