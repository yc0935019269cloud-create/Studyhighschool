<script>
MindMap.render({t:"第4單元 大氣與天氣", n:"主線：大氣的組成與分層（氣壓、溫度）→ 空氣上升冷卻成雲（水氣、絕熱）→ 空氣水平流動成風（三種力）→ 把這些畫在天氣圖上讀臺灣天氣。", c:[
 {t:"4-1 大氣分層", href:"../earth/u4-1.html", c:[
  {t:"空氣成分", n:"乾空氣：N₂ 約 78%、O₂ 約 21%，其餘以氬為主。<br><b>水氣</b>：隨時地變，集中低空；<b>CO₂、甲烷</b>：少量但吸收紅外線；<b>氣膠</b>：可當凝結核。<br>高山缺氧：O₂ 比例幾乎不變，是總氣壓（氧分壓）變小。"},
  {t:"氣壓", c:[
   {t:"＝ 上方空氣柱重量 ÷ 面積", n:"1 atm ＝ 1013.25 hPa ＝ 76 cmHg；1 hPa ＝ 100 Pa。<br>往上走，頭頂上的空氣變少 ⇒ 氣壓降低。"},
   {t:"低空降得快、高空降得慢", n:"低空空氣較密，同樣厚度的空氣較重。<br>0–10 km 平均約 76 hPa/km；20–30 km 約 5 hPa/km。"},
   {t:"用氣壓算空氣質量比例", n:"z 以上 ＝ p<sub>z</sub>/p₀；z 以下 ＝ (p₀ − p<sub>z</sub>)/p₀<br>約 5.5 km 氣壓剩一半 ⇒ 一半大氣<b>質量</b>在 5.5 km 以下。<br>10 km 約 250 hPa ⇒ 10 km 以下約 75%。"},
   {t:"讀圖陷阱", n:"先看軸：原圖高度在縱軸。密度與氣壓刻度不同，要對準<b>同一高度</b>再轉讀。"}]},
  {t:"三種分層標準", n:"依<b>溫度</b>：對流、平流、中氣、增溫層。<br>依<b>電離</b>：中性層、電離層。<br>依<b>成分混合</b>：均勻層、非均勻層（約 85 km 分界）。<br>同一高度可同時屬不同分類，電離層 ≠ 增溫層。"},
  {t:"溫度四層：降升降升", c:[
   {t:"對流層（0 至約 10 km）", n:"隨高度降溫，平均約 6.5 °C/km。熱源：<b>地表</b>。<br>水氣多，天氣現象都在這層。可有局部逆溫。"},
   {t:"平流層（約 10–50 km）", n:"上部增溫。熱源：<b>臭氧吸收紫外線</b>（臭氧層約 20–30 km）。<br>穩定、乾燥，垂直對流弱；飛機常在其底部飛。"},
   {t:"中氣層（約 50–85 km）", n:"隨高度降溫；中氣層頂是最冷處（約 −90 °C）。"},
   {t:"增溫層（85 km 以上）", n:"吸收高能太陽輻射（極紫外線、X 射線）而增溫；有極光、電離。<br>粒子平均動能高但空氣極稀薄，不代表能大量傳熱。"}]},
  {t:"對流層頂高度", n:"熱帶 > 極區；夏季 > 冬季。<br>沿平流層底部飛行而高度升高 ⇒ 飛向<b>低緯度</b>。"}]},
 {t:"4-2 雲霧的產生", href:"../earth/u4-2.html", c:[
  {t:"飽和水氣壓", n:"溫度愈高，飽和水氣壓愈高（能容納更多水氣）。<br>曲線右下未飽和、左上過飽和。<br>氣溫愈高 ⇒ <b>愈不容易</b>飽和。"},
  {t:"露點與相對溼度", c:[
   {t:"露點溫度", n:"水氣量不變、純降溫到飽和的溫度。<b>只看實際水氣壓</b>，與當下氣溫無關。"},
   {t:"相對溼度", n:"＝ 實際水氣壓 ÷ <b>同氣溫</b>下飽和水氣壓 × 100%<br>例：30 °C（飽和 40 hPa）、實際 35 hPa ⇒ 87.5%。<br>氣溫與露點差愈小，相對溼度愈高；水氣多的不一定溼度高。"},
   {t:"會不會起霧", n:"看氣溫能否降到露點（清晨最低溫 ＝ 露點 ⇒ 易起霧）。"}]},
  {t:"乾溼球溫度計", n:"溼球紗布水<b>蒸發吸熱</b> ⇒ 溼球 ≤ 乾球，差值不會是負的。<br>愈乾燥 ⇒ 溫差愈大。<br>飽和：乾球 ＝ 溼球 ＝ 露點；未飽和：乾球 ＞ 溼球 ＞ 露點。"},
  {t:"雲、霧、露、霜", n:"都是冷卻到飽和後凝結（凝華）。<br>高空 → 雲；近地面 → 霧；附著物體：液態露、固態霜。<br>需要<b>凝結核</b>（氣膠）。露點低於 0 °C 可直接凝華成冰。"},
  {t:"絕熱冷卻", n:"空氣是熱的不良導體 ⇒ 垂直運動可視為絕熱。<br><b>上升</b>：氣壓變小 → 膨脹對外作功 → 降溫。<br><b>下沉</b>：被壓縮 → 升溫。", c:[
   {t:"乾絕熱 vs 溼絕熱", n:"未飽和：乾絕熱，約 10 °C/km（降得快）。<br>飽和後：溼絕熱，約 5–6 °C/km（凝結放<b>潛熱</b>，降得慢）。<br>斜率轉折點 ＝ <b>抬升凝結高度</b>（雲底），此處溫度 ＝ 原露點。"},
   {t:"會不會繼續上升", n:"同高度比較：空氣塊溫度 ＞ 周圍 ⇒ 密度小、繼續上升；反之下沉或停止。"}]},
  {t:"使空氣上升的原因", n:"地表加熱對流、地形抬升（迎風坡）、鋒面抬升（暖空氣沿界面上升）、低層輻合。<br>背風坡下沉 → 增溫乾燥（焚風）。"}]},
 {t:"4-3 風向與風速", href:"../earth/u4-3.html", c:[
  {t:"三種水平力", c:[
   {t:"氣壓梯度力", n:"<b>垂直等壓線</b>，由高壓指向低壓；等壓線愈密 ⇒ 愈大 ⇒ 風愈強。<br>風的起因。"},
   {t:"科氏力", n:"地球自轉造成的假想力；恆<b>垂直風向</b>。<br>北半球偏右、南半球偏左。<br>緯度愈高愈大（赤道為 0）；風速愈快愈大；靜止沒有。"},
   {t:"摩擦力", n:"近地面與風向相反，使風變慢 → 科氏力變小 → 偏轉變少（<b>間接</b>影響風向）。<br>陸地摩擦大於海面。"}]},
  {t:"地轉風（高空）", n:"氣壓梯度力 ＝ 科氏力 ⇒ 風<b>平行等壓線</b>。<br>北半球：背風而立，低壓在左。"},
  {t:"地面風", n:"有摩擦，偏不到 90°（約 60–75°），斜穿等壓線吹向低壓，夾角約 15–30°。<br>摩擦愈大，夾角愈大。"},
  {t:"三步驟判風向", n:"①找等壓線走向 ②畫梯度力（垂直、指低壓）③北半球往右偏（高空 90°、地面約 60–75°）。<br>畫三力：p 指低壓；c 在風的右側垂直；f 與風相反。"},
  {t:"高壓與低壓（北半球）", n:"<b>高壓</b>：順時針向外輻散，中心下沉，晴朗。<br><b>低壓</b>：逆時針向內輻合，中心上升，雲雨。<br>南半球旋轉方向相反——可用來判斷半球。"},
  {t:"熱力環流", n:"地面：受熱處低壓、上升；冷處高壓、下沉。高空相反。<br>例：海陸風。"}]},
 {t:"4-4 氣象觀測與天氣圖", href:"../earth/u4-4.html", c:[
  {t:"觀測方式", n:"地面觀測；高空觀測（探空氣球／雷文送，約 30 km）。<br>遙測：大範圍、短時間。"},
  {t:"衛星雲圖", n:"<b>可見光</b>：愈白雲愈<b>厚</b>（夜間無法用）。<br><b>紅外線</b>：愈白雲頂愈<b>高</b>（溫度愈低）。<br>兩張都白 ⇒ 積雨雲。只看得到雲頂，看不到雲底、氣壓。"},
  {t:"雷達回波", n:"發射微波、接收降水粒子回波 ⇒ 降水位置與強度。<br>長帶狀 ＝ 鋒面；螺旋狀 ＝ 颱風；零星點狀 ＝ 熱對流。"},
  {t:"天氣符號", n:"長線指向<b>風的來向</b>，短羽表風速；圓內塗黑愈多雲愈多。<br>左上氣溫、左下露點；右上氣壓省略：136 → 1013.6 hPa、240 → 1024.0 hPa。"},
  {t:"地面天氣圖", n:"高壓 H、低壓 L、等壓線（每 4 hPa 一條）、鋒面、颱風。<br>天氣圖需要測站氣壓資料，不能只靠雲圖畫。"},
  {t:"鋒面", c:[
   {t:"冷鋒", n:"冷氣團推進，暖空氣被迫急升 → 積狀雲、短暫強雨。<br>過境：南風轉北風、氣溫下降、氣壓先降後升、轉晴。"},
   {t:"暖鋒", n:"暖氣團沿冷空氣緩升 → 層狀雲、範圍大、連續性降雨；過境後升溫。"},
   {t:"滯留鋒", n:"冷暖勢均力敵，停滯 → 長時間降雨（臺灣<b>梅雨</b>，5–6 月）。"},
   {t:"囚錮鋒", n:"冷鋒追上暖鋒，暖空氣被抬離地面。"}]},
  {t:"溫帶氣旋 vs 熱帶氣旋", n:"<b>溫帶氣旋</b>：中高緯度，伴隨冷暖鋒。<br><b>熱帶氣旋（颱風）</b>：熱帶溫暖海面，能量來自水氣凝結潛熱；無鋒面，等壓線密集近圓形。"},
  {t:"臺灣季節天氣", n:"<b>冬</b>：大陸冷高壓 → 東北季風、冷鋒、寒流（北部、東北部多雨）。<br><b>春末夏初</b>：滯留鋒 → 梅雨。<br><b>夏</b>：太平洋高壓、西南季風 → 午後雷陣雨、颱風；大陸為熱低壓。<br><b>秋</b>：仍有颱風，東北季風漸起。"}]}
]});
</script>
