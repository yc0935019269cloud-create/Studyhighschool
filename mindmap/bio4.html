<script>
MindMap.render({t:"第4單元 分子生物學", n:"主線：遺傳物質是誰？（DNA）→ 長什麼樣、怎麼複製 → 怎麼變成蛋白質（中心法則）→ 出錯會怎樣（突變）→ 人類怎麼利用（生物科技）。", c:[
 {t:"4-1 核酸的發現", href:"../biology/u4-1.html", n:"問題：染色體由蛋白質和 DNA 組成，哪一個才攜帶遺傳訊息？", c:[
  {t:"格里夫茲（1928）轉形作用", n:"肺炎雙球菌：S 型（有莢膜、致病）、R 型（無莢膜、不致病）。<ul><li>活 S → 鼠死</li><li>活 R → 鼠活</li><li>熱殺 S → 鼠活</li><li>熱殺 S ＋ 活 R → 鼠死，血中有<b>活 S 型</b></li></ul>死 S 菌中的某物質使 R 變 S，且可遺傳 ⇒ <b>轉形作用</b>。只證明有「轉形物質」，還沒說是 DNA。"},
  {t:"艾佛瑞（1944）轉形物質是 DNA", n:"熱殺 S 萃取液 ＋ R 菌，每盤加一種酶<b>只拿掉一種物質</b>：<br>加蛋白酶、RNA 酶 → 仍轉形；加 <b>DNA 酶</b> → 不轉形 ⇒ 轉形物質是 DNA。"},
  {t:"赫希與蔡司（1952）噬菌體", n:"噬菌體只有蛋白質外殼 ＋ DNA。<ul><li>³⁵S 標記蛋白質 → 放射性在<b>上清液</b>（外殼）</li><li>³²P 標記 DNA → 放射性在<b>沉澱</b>（細菌內）</li></ul>步驟：標記 → 感染 → 果汁機攪拌 → 離心。進入細菌的只有 DNA ⇒ DNA 是遺傳物質。"},
  {t:"其他證據", n:"<ul><li>分裂前 DNA 加倍、再平均分配</li><li>2n 細胞 DNA 量是配子（n）的兩倍</li></ul>"},
  {t:"細菌的三種遺傳重組", n:"<b>轉形</b>：吸收環境中的 DNA<br><b>接合</b>：兩細菌接觸，經管道傳 DNA<br><b>轉導</b>：噬菌體把 DNA 從一菌帶到另一菌"}]},
 {t:"4-2 核酸構造與 DNA 複製", href:"../biology/u4-2.html", c:[
  {t:"核苷酸＝鹼基＋五碳醣＋磷酸", n:"DNA：去氧核糖（2′ 只有 H），鹼基 A、T、G、C<br>RNA：核糖（2′ 有 OH），鹼基 A、<b>U</b>、G、C"},
  {t:"發現雙股螺旋的證據", c:[
   {t:"查加夫法則（1950）", n:"同一物種 A ≈ T、G ≈ C；不同物種鹼基比例不同（物種特異性）。<br>注意：A＋G ＝ T＋C，但 A＋T 不一定等於 G＋C。"},
   {t:"富蘭克林 X 光繞射（1952）", n:"X 形繞射圖暗示 DNA 是螺旋。"},
   {t:"華生與克里克（1953）", n:"雙股螺旋：直徑 2 nm、每圈 3.4 nm（10 對鹼基）。<br><b>A–T 兩個氫鍵、G–C 三個氫鍵</b>；兩股<b>反向平行</b>（5′→3′ 對 3′→5′）。<br>G–C 比例愈高 ⇒ 愈不易解開。"}]},
  {t:"中心法則", n:"<b>複製</b> DNA → DNA<br><b>轉錄</b> DNA → RNA（細胞核）<br><b>轉譯</b> mRNA → 蛋白質（核糖體）<br>補充：反轉錄 RNA → DNA（反轉錄病毒）。"},
  {t:"RNA 三種類型", n:"<b>mRNA</b>：帶密碼到核糖體<br><b>tRNA</b>：帶胺基酸、有反密碼子<br><b>rRNA</b>：組成核糖體"},
  {t:"半保留複製（梅舍生與史塔爾 1958）", n:"大腸桿菌先養在 ¹⁵N，再移到 ¹⁴N，每代離心：<ul><li>第 1 代：全部中間帶（排除保留複製）</li><li>第 2 代：中：輕 ＝ 1：1（排除分散複製）</li></ul>第 n 代：中間帶永遠 2 個，其餘 2ⁿ − 2 個是輕的。"},
  {t:"複製過程", c:[
   {t:"起始點與複製泡", n:"雙向進行。原核環狀 DNA <b>一個</b>起始點；真核 DNA 很長，<b>多個</b>起始點同時複製。"},
   {t:"酵素分工", n:"①解旋酶：打開雙股<br>②單股結合蛋白：穩住單股<br>③引子酶：做 <b>RNA 引子</b><br>④DNA 聚合酶：延長新股<br>⑤DNA 連接酶：接起片段"},
   {t:"只能 5′→3′ 延長", n:"DNA 聚合酶只能把核苷酸接在 <b>3′ 端 OH</b>，且不能從零開始（要引子）。"},
   {t:"領先股與延滯股", n:"領先股：順著解開方向，<b>連續</b>合成。<br>延滯股：一段段<b>岡崎片段</b>，再由連接酶接起。"}]}]},
 {t:"4-3 基因表現", href:"../biology/u4-3.html", c:[
  {t:"一基因一酵素 → 一基因一多肽", n:"畢德與特吞：紅麵包黴突變株各缺一種酵素，補上被擋住步驟<b>之後</b>的產物就能長。<br>修正：一基因一多肽（血紅素有 4 條多肽）；再修正：基因＝一段具功能的 DNA（tRNA、rRNA 基因不轉譯）。"},
  {t:"轉錄 DNA → RNA", c:[
   {t:"模版股與編碼股", n:"只讀<b>一股</b>（模版股）；編碼股序列與 RNA 相同，只是 T 換成 U。不同基因可用不同股當模版。"},
   {t:"啟動子 → 延長 → 終止", n:"RNA 聚合酶結合<b>啟動子</b>，沿模版合成 RNA（5′→3′），到終止序列脫離。<br>RNA 聚合酶不需要引子。"},
   {t:"真核轉錄後修飾", n:"前驅 mRNA 在細胞核內加工：<ul><li>5′ 端加帽</li><li>3′ 端加多腺苷酸尾</li><li>剪掉<b>內含子</b>、接起<b>外顯子</b></li></ul><b>選擇性剪接</b>：一個基因 → 多種蛋白質。"}]},
  {t:"遺傳密碼", n:"3 個鹼基一個密碼子：4³ ＝ 64 種（4² ＝ 16 不夠 20 種胺基酸）。<br>61 個對應胺基酸；<b>AUG</b> 起始（Met）；<b>UAA、UAG、UGA</b> 終止。<br>尼倫柏格與柯拉納（1966）解讀全部密碼。"},
  {t:"轉譯 mRNA → 多肽", c:[
   {t:"tRNA", n:"3′ 端 CCA 接胺基酸；環上<b>反密碼子</b>與密碼子互補配對。"},
   {t:"核糖體", n:"大、小次單元（rRNA ＋ 蛋白質）；A、P、E 三個 tRNA 位置。<br>原核 70S、真核 80S ⇒ 抗生素可只抑制細菌。"},
   {t:"起始 → 延長 → 終止", n:"起始：Met-tRNA 在 P 位對上 AUG。<br>延長：新 tRNA 進 A 位 → 接胜肽鍵 → 核糖體移位。<br>終止：釋放因子進 A 位，多肽脫離。<br>讀 mRNA 5′→3′；多肽由 <b>N 端 → C 端</b>。"},
   {t:"聚核糖體", n:"一條 mRNA 上同時多個核糖體；愈靠近 3′ 端的核糖體多肽愈長。"},
   {t:"轉譯後修飾", n:"接醣、脂質、磷酸；切掉開頭 Met；切成數段。<br>例：胰島素原切掉中間片段，留下以<b>雙硫鍵</b>相連的 α（21）、β（30）兩鏈。"}]},
  {t:"原核 vs 真核", n:"原核：無核膜，轉錄、轉譯可同時進行；一條 mRNA 可有多個起始點、做多種蛋白質。<br>真核：先在核內轉錄加工，再到細胞質轉譯；一條 mRNA 做一種蛋白質。"},
  {t:"基因調控", c:[
   {t:"操縱組（賈克伯與莫諾 1961）", n:"操縱組＝啟動子＋操作子＋結構基因（<b>不含調節基因</b>）。"},
   {t:"乳糖操縱組（可誘導）", n:"沒乳糖：抑制蛋白結合操作子 → 不轉錄。<br>有乳糖：乳糖使抑制蛋白失活 → 做出分解乳糖的 3 種酶。"},
   {t:"色胺酸操縱組（可抑制）", n:"缺色胺酸：抑制蛋白無活性 → 合成 5 種酶。<br>色胺酸多：色胺酸使抑制蛋白活化 → 關閉。"},
   {t:"真核調控", n:"激素經受體（或進入細胞）活化調節蛋白 → 調控特定基因轉錄。<br>細胞分化：每個細胞基因相同，表現的基因不同。"}]}]},
 {t:"4-4 遺傳變異", href:"../biology/u4-4.html", c:[
  {t:"染色體構造", n:"間期為染色質；分裂期濃縮成染色體。DNA 纏組蛋白成<b>核小體</b>（11 nm），層層摺疊到 1400 nm。"},
  {t:"構造變異", n:"輻射、化學物質、病毒使染色體斷裂再接錯。", c:[
   {t:"缺失", n:"少一段；配對時正常染色體拱成圈環。<br>例：第 5 號短臂缺失 → <b>貓叫症</b>。"},
   {t:"重複", n:"某段出現兩次。<br>例：玉米有色基因重複愈多顏色愈深；果蠅 Bar 重複 → 棒眼。"},
   {t:"倒位", n:"斷兩處，中間倒轉 180°：abcdef → adcbef。<br>基因數不變、連鎖群不變，通常不影響表現型。"},
   {t:"易位", n:"兩條<b>非同源</b>染色體交換片段 ⇒ 連鎖群改變；通常不影響表現型。"}]},
  {t:"數目變異", c:[
   {t:"非整倍體（無分離）", n:"減數分裂時同源染色體或姐妹染色分體沒分開。<br>第一次分裂無分離：配子<b>全部</b>異常；第二次：<b>一半</b>異常。<br>例：唐氏症（21 號三體）、性染色體異常。"},
   {t:"整倍體（多倍體）", n:"奇數倍（3n）聯會紊亂、不結種子。<br>同源多倍體：<b>三倍體無子西瓜</b>（秋水仙素做出 4n，4n♀ × 2n → 3n）。<br>異源多倍體：新世界棉（雙二倍體，26 對＝13＋13）。"}]},
  {t:"基因突變（點突變）", c:[
   {t:"同義突變", n:"密碼子改變但胺基酸不變。"},
   {t:"誤義突變", n:"換成另一個胺基酸。<br>例：<b>鐮形血球貧血症</b>，β 鏈第 6 個 Glu → Val（GAG → GUG）。"},
   {t:"無義突變", n:"變成終止密碼子 → 多肽提早結束。"},
   {t:"框移突變", n:"插入或刪除 1（或非 3 倍數）個鹼基 → 之後密碼全部錯讀，通常最嚴重。"}]},
  {t:"突變因子與修補", n:"紫外線 → 胸腺嘧啶二聚物 → <b>切除型修補</b>（核酸酶切、DNA 聚合酶補、連接酶接）。<br>亞硝酸：C 去胺成 U → G–C 變 A–T。"},
  {t:"突變與演化", n:"多數有害，好壞看<b>環境</b>。突變提供原料，但<b>不決定演化方向</b>（方向由天擇決定）。"},
  {t:"遺傳疾病", n:"篩檢：婚前檢查、遺傳諮詢、產前診斷、新生兒篩檢。<br>治療：飲食藥物、手術、基因療法。"}]},
 {t:"4-5 生物科技", href:"../biology/u4-5.html", c:[
  {t:"基因放大（活體）", n:"把基因接到<b>質體</b>（細菌染色體外的小環狀 DNA），隨細菌分裂大量複製。"},
  {t:"PCR（穆勒斯 1987）", n:"試管中大量複製特定片段。需要：模版、<b>引子（一對）</b>、四種核苷酸、<b>耐熱 DNA 聚合酶</b>（Taq，錢嘉韻 1976 從溫泉菌分離）。<br>每循環：加熱分開雙股 → 冷卻讓引子黏合 → 延伸。<br>n 次循環 ⇒ 理論 2ⁿ 倍（10 次 ≈ 1000 倍）。"},
  {t:"重組 DNA", c:[
   {t:"限制酶", n:"辨識特定回文序列切開。例：EcoRI 辨識 GAATTC，在 G 與 A 之間切，留下 AATT <b>黏性端</b>。<br>用<b>同一種</b>限制酶切兩種 DNA，黏性端才能互補。"},
   {t:"連接酶", n:"把黏合處的磷酸雙酯鍵接起來。"},
   {t:"完整流程", n:"①分離目標基因與質體 ②同一限制酶切 ③黏性端配對 ④連接酶接 ⑤送回細菌 ⑥抗生素培養基篩選 ⑦大量培養"}]},
  {t:"基因轉殖", n:"把外源基因送進生物體。<b>不包括</b>傳統育種、細胞融合、雜交、誘變、體外受精、染色體倍增。", c:[
   {t:"植物", n:"農桿菌 <b>Ti 質體</b>（基因接進 T-DNA 嵌入植物染色體）；基因槍。"},
   {t:"動物", n:"<b>顯微注射</b>到受精卵細胞核，再植入代孕母體（1981 基因轉殖鼠）。"}]},
  {t:"安全評估", n:"評估對人體健康、對環境生態的影響。"},
  {t:"探討活動：DNA 粗萃取與電泳", n:"破細胞 → 去蛋白 → 加冷酒精使 DNA 析出（白色絲狀）。<br>電泳：DNA 帶負電往<b>正極</b>移動；片段愈小跑愈遠。"}]}
]});
